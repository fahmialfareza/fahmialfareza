name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download Stats SVGs
        run: |
          BASE="https://github-readme-stats.vercel.app/api"
          PARAMS="theme=tokyonight&hide_border=true"
          USER="fahmialfareza"

          echo "Fetching GitHub Stats..."
          curl -v -f "$BASE?username=$USER&show_icons=true&$PARAMS&count_private=true&include_all_commits=true&rank_icon=github" \
            -o assets/stats.svg && echo "✅ Stats OK" || echo "⚠️ Stats fetch failed"

          echo "Fetching Top Languages..."
          curl -v -f "$BASE/top-langs/?username=$USER&layout=compact&$PARAMS&langs_count=8" \
            -o assets/top-langs.svg && echo "✅ Top langs OK" || echo "⚠️ Top langs fetch failed"

      - name: Verify SVGs
        run: |
          echo "=== assets/ contents ==="
          ls -lh assets/ || echo "assets/ is empty"
          echo "=== stats.svg preview ==="
          head -5 assets/stats.svg 2>/dev/null || echo "stats.svg not found"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update github stats [skip ci]"
          git push
